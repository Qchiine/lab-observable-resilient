server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: pricing-service

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics"
  endpoint:
    health:
      show-details: "always"
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: pricing-service
    tp: "TP 26 - service observable et resilient"
